<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | These Are Small Things</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .success-container {
            text-align: center;
            max-width: 600px;
        }
        .success-container h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            color: var(--soft-gold);
            margin-bottom: 1rem;
        }
        .success-container p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✓</div>
        <h1>Thank You!</h1>
        <p>Your message has been sent successfully. We'll get back to you soon!</p>
        <a href="index.html" class="btn btn-primary">Return to Home</a>

</html>
